<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業人力資源管理系統 | DUCK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <div class="login-logo">⏰</div>
    <h1>DUCK</h1>
    <p class="login-subtitle">企業人力資源管理系統</p>
    <div id="loginError" class="login-error"></div>
    <div class="form-group">
      <label>員工編號 / 帳號</label>
      <input type="text" id="loginUser" class="form-control" placeholder="請輸入帳號" value="admin">
    </div>
    <div class="form-group">
      <label>密碼</label>
      <input type="password" id="loginPass" class="form-control" placeholder="請輸入密碼" value="admin123">
    </div>
    <button class="btn btn-primary btn-lg" onclick="doLogin()" style="margin-top:12px">登入系統</button>
    <div class="login-hint">預設帳號: admin / admin123</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>⏰ DUCK</h1>
      <p>企業人力資源管理系統</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">主要功能</div>
        <div class="nav-item" data-page="clock"><span class="icon">⏱️</span>員工打卡<span id="badge-clock"></span></div>
        <div class="nav-item" data-page="dashboard"><span class="icon">📊</span>儀表板<span id="badge-dashboard"></span></div>
        <div class="nav-item" data-page="records"><span class="icon">📋</span>出勤記錄<span id="badge-records"></span></div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">申請管理</div>
        <div class="nav-item" data-page="leave"><span class="icon">🏖️</span>請假管理<span id="badge-leave"></span></div>
        <div class="nav-item" data-page="overtime"><span class="icon">🕐</span>加班管理<span id="badge-overtime"></span></div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">排班與公告</div>
        <div class="nav-item" data-page="schedule"><span class="icon">📅</span>排班管理<span id="badge-schedule"></span></div>
        <div class="nav-item" data-page="announcements"><span class="icon">📢</span>公告系統<span id="badge-announcements"></span></div>
      </div>
      <div class="nav-section admin-only">
        <div class="nav-section-title">系統管理</div>
        <div class="nav-item" data-page="employees"><span class="icon">👥</span>員工管理</div>
        <div class="nav-item" data-page="departments"><span class="icon">🏢</span>部門管理</div>
        <div class="nav-item" data-page="salary"><span class="icon">💰</span>薪資報表</div>
        <div class="nav-item" data-page="reports"><span class="icon">📈</span>統計報表</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info" onclick="doLogout()">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-details">
          <div class="name" id="userName">管理員</div>
          <div class="role" id="userRole">系統管理員</div>
        </div>
        <span style="color:var(--text-muted);font-size:12px">登出</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h2 id="pageTitle">儀表板</h2>
      </div>
      <div class="topbar-right">
        <div class="topbar-date" id="topDate"></div>
        <div class="topbar-clock" id="topClock">00:00:00</div>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">標題</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
